<title>ABOUT - TELwing</title>

<style>
    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        padding: 0;
        background: #eeeeee;
        color: #333333;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Yu Gothic",
            "Hiragino Kaku Gothic ProN",
            Meiryo,
            sans-serif;
        font-size: 14px;
        line-height: 1.8;
    }

    .site {
        width: 960px;
        margin: 0 auto;
        background: #ffffff;
        min-height: 100vh;
        border-left: 1px solid #dddddd;
        border-right: 1px solid #dddddd;
    }

    /* ====================
       ヘッダー
    ==================== */

    header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 35px;
        border-bottom: 1px solid #dddddd;
    }

    .site-title {
        margin: 0;
        font-size: 24px;
        font-weight: normal;
        letter-spacing: 1px;
        white-space: nowrap;
    }

    /* ====================
       ナビゲーション
    ==================== */

    nav {
        margin-left: auto;
        white-space: nowrap;
    }

    nav a {
        display: inline-block;
        padding: 5px 15px;
        color: #555555;
        text-decoration: none;
        border-right: 1px solid #eeeeee;
    }

    nav a:first-child {
        border-left: 1px solid #eeeeee;
    }

    nav a:hover {
        background: #f3f3f3;
        color: #111111;
    }

    /* ====================
       メイン
    ==================== */

    main {
        padding: 30px 35px 60px;
    }

    section {
        margin-bottom: 45px;
    }

    .section-title {
        margin: 0 0 18px;
        padding-bottom: 7px;
        border-bottom: 1px solid #cccccc;
        font-size: 18px;
        font-weight: normal;
        color: #444444;
    }

    .section-title small {
        margin-left: 8px;
        color: #aaaaaa;
        font-size: 11px;
    }

    /* ====================
       ABOUT本文
    ==================== */

    .info-box {
        padding: 20px;
        background: #fafafa;
        border: 1px solid #dddddd;
    }

    .info-box p {
        margin: 0 0 15px;
    }

    .info-box p:last-child {
        margin-bottom: 0;
    }

    /* ====================
       PROFILE
    ==================== */

    .profile {
        width: 100%;
        border-collapse: collapse;
    }

    .profile th,
    .profile td {
        padding: 10px 12px;
        border: 1px solid #dddddd;
        text-align: left;
    }

    .profile th {
        width: 180px;
        background: #f5f5f5;
        font-weight: normal;
    }

    /* ====================
       LINKS
    ==================== */

    .link-list {
        margin: 0;
        padding: 0;
        list-style: none;
    }

    .link-list li {
        padding: 10px 12px;
        border-bottom: 1px dotted #cccccc;
    }

    .link-list li:first-child {
        border-top: 1px solid #dddddd;
    }

    .link-list a {
        color: #555555;
    }

    .link-list a:hover {
        color: #000000;
    }

    /* ====================
       フッター
    ==================== */

    footer {
        padding: 20px 35px;
        border-top: 1px solid #dddddd;
        color: #999999;
        font-size: 11px;
        text-align: center;
    }

    /* ====================
       タブレット
    ==================== */

    @media (max-width: 960px) {

        .site {
            width: 100%;
            border-left: 0;
            border-right: 0;
        }

        header {
            padding-left: 20px;
            padding-right: 20px;
        }

        main {
            padding-left: 20px;
            padding-right: 20px;
        }
    }

    /* ====================
       スマホ
    ==================== */

    @media (max-width: 600px) {

        header {
            display: block;
            padding-top: 18px;
            padding-bottom: 10px;
        }

        .site-title {
            margin-bottom: 10px;
        }

        nav {
            margin-left: 0;
            overflow-x: auto;
            white-space: nowrap;
        }

        nav a {
            padding-left: 12px;
            padding-right: 12px;
        }

        .profile th {
            width: 35%;
        }
    }
</style>
```

</head>
