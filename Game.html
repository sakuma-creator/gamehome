<title>GAME - TELwing</title>

<style>
    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        padding: 0;
        background: #eeeeee;
        color: #333333;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Yu Gothic",
            "Hiragino Kaku Gothic ProN",
            Meiryo,
            sans-serif;
        font-size: 14px;
        line-height: 1.8;
    }

    .site {
        width: 960px;
        margin: 0 auto;
        background: #ffffff;
        min-height: 100vh;
        border-left: 1px solid #dddddd;
        border-right: 1px solid #dddddd;
    }

    /* ====================
       ヘッダー
    ==================== */

    header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 35px;
        border-bottom: 1px solid #dddddd;
    }

    .site-title {
        margin: 0;
        font-size: 24px;
        font-weight: normal;
        letter-spacing: 1px;
        white-space: nowrap;
    }

    /* ====================
       ナビゲーション
    ==================== */

    nav {
        margin-left: auto;
        white-space: nowrap;
    }

    nav a {
        display: inline-block;
        padding: 5px 15px;
        color: #555555;
        text-decoration: none;
        border-right: 1px solid #eeeeee;
    }

    nav a:first-child {
        border-left: 1px solid #eeeeee;
    }

    nav a:hover {
        background: #f3f3f3;
        color: #111111;
    }

    /* ====================
       メイン
    ==================== */

    main {
        padding: 30px 35px 60px;
    }

    .section-title {
        margin: 0 0 18px;
        padding-bottom: 7px;
        border-bottom: 1px solid #cccccc;
        font-size: 18px;
        font-weight: normal;
        color: #444444;
    }

    .section-title small {
        margin-left: 8px;
        color: #aaaaaa;
        font-size: 11px;
    }

    /* ====================
       ゲーム一覧
    ==================== */

    .game-list {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
    }

    .game-card {
        display: block;
        padding: 25px 20px;
        border: 1px solid #dddddd;
        background: #fafafa;
        color: #333333;
        text-decoration: none;
    }

    .game-card:hover {
        background: #f3f3f3;
    }

    .game-title {
        margin-bottom: 5px;
        font-size: 20px;
        font-weight: normal;
    }

    .game-description {
        color: #777777;
        font-size: 13px;
    }

    .game-version {
        margin-top: 15px;
        color: #999999;
        font-size: 12px;
    }

    /* ====================
       フッター
    ==================== */

    footer {
        padding: 20px 35px;
        border-top: 1px solid #dddddd;
        color: #999999;
        font-size: 11px;
        text-align: center;
    }

    /* ====================
       タブレット
    ==================== */

    @media (max-width: 960px) {

        .site {
            width: 100%;
            border-left: 0;
            border-right: 0;
        }

        header {
            padding-left: 20px;
            padding-right: 20px;
        }

        main {
            padding-left: 20px;
            padding-right: 20px;
        }
    }

    /* ====================
       スマホ
    ==================== */

    @media (max-width: 600px) {

        header {
            display: block;
            padding-top: 18px;
            padding-bottom: 10px;
        }

        .site-title {
            margin-bottom: 10px;
        }

        nav {
            margin-left: 0;
            overflow-x: auto;
            white-space: nowrap;
        }

        nav a {
            padding-left: 12px;
            padding-right: 12px;
        }

        .game-list {
            grid-template-columns: 1fr;
        }
    }
</style>
```

</head>

<body>

<div class="site">
